<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNIO Round 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* =====================================================================
   UNIO v9 — Round 2 · Steel palette (#06141B #11212D #253745 #4A5C6A #9BA8AB #CCD0CF)
   Darkness carries hierarchy. #11212D = action on light, #CCD0CF = action on dark.
   #9BA8AB only on dark surfaces or as a line. Functional colours only for status.
   ===================================================================== */
:root{
  --ink:#06141b; --navy:#11212d; --slate:#253745; --steel:#4a5c6a; --mist:#9ba8ab; --bone:#ccd0cf;
  --page:#eef0ef; --card:#ffffff; --line:#d9dddc; --line2:#c4cacb; --soft:#f5f6f6; --navy2:#1b2d3a;
  --ok:#2f6b4f; --ok-bg:#e3f0e8; --ok-ln:#9cc7b0;
  --wait:#7a4f00; --wait-bg:#fbecc8; --wait-ln:#ecc977;
  --att:#9b2c3a; --att-bg:#f8dfe2; --att-ln:#e7a9b3;
  --info:#1d4a6e; --info-bg:#dde9f3; --info-ln:#a9c6de;
  --gold:#b8862a; --ai:#3b4f9a; --ai-bg:#e6eaf7; --ai-ln:#b7c1e6;
  --sans:'Manrope',ui-sans-serif,system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --r1:4px; --r2:8px; --r3:14px; --r4:20px;
  --sh1:0 1px 2px rgba(6,20,27,.05),0 8px 24px -16px rgba(6,20,27,.35);
  --sh2:0 2px 4px rgba(6,20,27,.06),0 24px 48px -24px rgba(6,20,27,.45);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:#dfe3e2;color:var(--ink)}
body{font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.sm{width:13px;height:13px} svg.i.lg{width:20px;height:20px}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- mockup toolbar (not part of UNIO) ---------- */
.mbar{position:sticky;top:0;z-index:50;background:var(--ink);color:#e1e6e9;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border-bottom:1px solid #1b2d3a}
.mbar .t{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.mbar select{background:var(--navy);color:#eef0ef;border:1px solid var(--slate);border-radius:var(--r2);padding:7px 10px;font:600 13px var(--sans);max-width:100%;min-width:0}
.mbar .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mbar button{background:var(--navy);border:1px solid var(--slate);border-radius:var(--r2);padding:6px 11px;font-size:13px;color:#eef0ef}
.mbar button[aria-pressed="true"]{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.mbar .note{font-size:12px;color:var(--mist);flex:1 1 260px;min-width:0}
.mbar .new{font-family:var(--mono);font-size:10px;letter-spacing:.1em;background:var(--ok-bg);color:var(--ok);border-radius:3px;padding:2px 6px}
.stage{padding:0}
.stage.phone{padding:24px 16px}
#frame{container-type:inline-size;container-name:f;background:var(--page);margin-inline:auto;min-height:90vh;overflow:hidden}
.stage.phone #frame{max-width:390px;border-radius:30px;border:8px solid var(--ink);box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}

/* ---------- primitives ---------- */
.u{font-family:var(--sans);color:var(--ink);background:var(--page);font-size:14px;line-height:1.55}
.u h1,.u h2,.u h3,.u h4{margin:0;font-weight:800;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.u h1 em,.u h2 em{font-style:normal;font-weight:300;color:var(--steel)}
.u p{margin:0}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:40px}
.eyebrow{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--steel)}
.muted{color:var(--steel)} .small{font-size:12.5px} .num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0} .row.top{align-items:flex-start} .row.wrap-r{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;min-width:0} /*g4 grid below*/.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}.g32{gap:32px}
.grow{flex:1 1 auto;min-width:0} .sp{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid transparent;white-space:nowrap;transition:background .2s,color .2s,transform .2s}
.btn.sm{height:34px;padding:0 13px;font-size:13px;gap:6px} .btn.lg{height:50px;padding:0 26px;font-size:15px}
.btn.pri{background:var(--navy);color:#fff} .btn.pri:hover{background:var(--ink)}
.btn.sec{border-color:var(--navy);color:var(--navy);background:transparent} .btn.sec:hover{background:var(--navy);color:#fff}
.btn.gh{color:var(--navy)} .btn.gh:hover{background:rgba(17,33,45,.06)}
.btn.lt{background:var(--bone);color:var(--ink)} .btn.lt:hover{background:#fff}
.btn.ol{border-color:rgba(204,208,207,.5);color:#eef0ef} .btn.ol:hover{background:rgba(255,255,255,.08)}
.btn.ok{background:var(--ok);color:#fff} .btn.dg{border-color:var(--att-ln);color:var(--att);background:#fff}
.btn.full{width:100%}
.ib{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r3)}
.card.pad{padding:22px}
.card.dark{background:var(--navy);border-color:var(--navy);color:#e1e6e9}
.hr{height:1px;background:var(--line);border:0;margin:0}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok)} .dot.busy{background:#d99a00} .dot.off{background:var(--mist)}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:700;font-size:13px;width:40px;height:40px;flex-shrink:0;color:var(--navy);letter-spacing:-.02em}
.av.lg{width:64px;height:64px;font-size:20px} .av.xl{width:112px;height:112px;font-size:34px;border:5px solid var(--page)} .av.sm{width:30px;height:30px;font-size:11px}
.c0{background:#cfd9de}.c1{background:#d8d2c4}.c2{background:#d4dcd3}.c3{background:#d7d3dd}.c4{background:#dcd6cf}

/* pills / chips */
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;display:inline-block;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-ln)}
.pill.wait{background:var(--wait-bg);color:var(--wait);border-color:var(--wait-ln)}
.pill.att{background:var(--att-bg);color:var(--att);border-color:var(--att-ln)}
.pill.info{background:var(--info-bg);color:var(--info);border-color:var(--info-ln)}
.pill.neu{background:#e8ebeb;color:var(--slate);border-color:var(--line2)}
.pill.dk{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill.ai{background:var(--ai-bg);color:var(--ai);border-color:var(--ai-ln)}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:var(--r1);padding:2px 8px;font-size:12px;color:var(--slate);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
/* tool chip: verified (dark) vs self-reported (light) vs certified (outlined) */
.tc{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid}
.tc.v{background:var(--navy);color:#fff;border-color:var(--navy)}
.tc.v svg{color:#8fd1ae}
.tc.s{background:#fff;color:var(--steel);border-color:var(--line2)}
.tc.p{background:var(--wait-bg);color:var(--wait);border-color:var(--wait-ln)}
.tc.c{background:#fff;color:var(--navy);border-color:var(--navy)}
.tc.m{background:linear-gradient(120deg,var(--ink),var(--slate));color:#fff;border-color:var(--ink)} .tc.m b{color:#e9c46a}
.ai-mark{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ai);background:var(--ai-bg);border:1px solid var(--ai-ln);border-radius:4px;padding:1px 5px}
.demo{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);border:1px dashed var(--line2);border-radius:3px;padding:0 4px}

/* proof chain: workflow as connected nodes */
.chain{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:12px;font-weight:600;color:var(--slate)}
.chain span{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:#eef1f1;border:1px solid var(--line)}
.chain span.v{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok)}
.chain em{font-style:normal;color:var(--mist);font-weight:400}

/* trust ladder */
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.ladder i{height:6px;border-radius:3px;background:var(--line)}
.ladder i.on{background:var(--slate)} .ladder i.on.top{background:linear-gradient(90deg,var(--ink),var(--slate))}
.ladder-l{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;font-size:10px;color:var(--steel);margin-top:4px;font-family:var(--mono);letter-spacing:.04em}

/* match ring */
.ring{--v:80;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--navy) calc(var(--v)*1%),var(--line) 0);display:grid;place-items:center;flex-shrink:0}
.ring span{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;letter-spacing:-.03em}
.ring.lg{width:84px;height:84px} .ring.lg span{width:68px;height:68px;font-size:24px}
.ring.dk span{background:var(--navy);color:#fff}
.reasons{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.reasons div{display:flex;gap:7px;align-items:flex-start} .reasons svg{color:var(--ok);margin-top:2px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:12.5px}
.bar b{display:block;height:7px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.bar b i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--navy)}
.bar b i.half{background:var(--mist)}

/* license ticket */
.ticket{position:relative;background:linear-gradient(135deg,var(--ink),var(--navy) 60%,var(--slate));color:#e1e6e9;border-radius:var(--r3);padding:22px 24px;overflow:hidden}
.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--page);transform:translateY(-50%)}
.ticket:before{left:-11px} .ticket:after{right:-11px}
.ticket .perf{position:absolute;left:18px;right:18px;top:50%;border-top:1px dashed rgba(155,168,171,.35)}
.ticket dl{display:grid;grid-template-columns:130px 1fr;gap:8px 16px;margin:0;font-size:13px}
.ticket dt{color:var(--mist)} .ticket dd{margin:0;color:#fff;font-weight:600}
.ticket .stamp{position:absolute;right:20px;top:18px;border:2px solid #8fd1ae;color:#8fd1ae;border-radius:6px;padding:3px 8px;font:700 11px var(--mono);letter-spacing:.12em;transform:rotate(6deg)}

/* filmstrip versions */
.film{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.film .fv{border:1px solid var(--line);border-radius:var(--r2);background:#fff;overflow:hidden;display:flex;flex-direction:column}
.film .fv.cur{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.film .fv .art{border-radius:0}
.film .fv .b{padding:9px 10px;display:flex;flex-direction:column;gap:5px;font-size:12px}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);font-weight:400;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
.tbl td{padding:13px 16px;border-bottom:1px solid #edf0ef;vertical-align:middle;font-size:13.5px}
.tbl tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.fld small{font-weight:400;color:var(--steel)}
.input{height:44px;border:1px solid #9aa5aa;border-radius:var(--r2);padding:0 12px;background:#fff;font-weight:500;font-size:14px;width:100%}
textarea.input{height:auto;padding:10px 12px;line-height:1.5;resize:vertical}
.input.ai{border-color:var(--ai-ln);background:linear-gradient(0deg,rgba(230,234,247,.55),rgba(230,234,247,.55)),#fff}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;font-size:13.5px;min-height:30px}
.chk input{width:17px;height:17px;accent-color:var(--navy);margin:0}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:#fff;flex-wrap:wrap}
.seg button,.seg span{padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--steel)}
.seg .on{background:var(--navy);color:#fff}
.chipsel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:#fff;color:var(--slate)}
.chipsel.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* public header */
.hd{background:#fff;border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:28px;height:68px}
.hd nav{display:flex;gap:24px;font-weight:600;font-size:14px;color:var(--steel)}
.hd nav a.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink);padding-bottom:4px}
.hd .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.hd.dark{background:transparent;border-bottom-color:rgba(155,168,171,.18)} .hd.dark nav{color:var(--mist)} .hd.dark nav a.on{color:#fff;box-shadow:inset 0 -2px 0 #fff}
.hd .search{flex:1 1 320px;max-width:420px;display:flex;align-items:center;gap:8px;height:40px;border-radius:999px;background:var(--page);padding:0 14px;color:var(--steel);font-size:13px}
.ft{background:var(--ink);color:var(--mist);padding:40px 0 28px;font-size:13px}
.ft .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}

/* app shell */
.app{display:grid;grid-template-columns:262px 1fr;min-height:90vh}
.side{background:var(--navy);color:var(--bone);padding:22px 14px;display:flex;flex-direction:column;gap:14px}
.side .ws{border:1px solid var(--slate);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.side .ws b{color:#fff;font-size:14.5px} .side .ws small{color:var(--mist);font-size:12px;display:block}
.side .ws select{background:var(--ink);color:#fff;border:1px solid var(--steel);border-radius:8px;height:38px;padding:0 10px;font:600 13px var(--sans);width:100%}
.side .lab{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--steel);padding:6px 10px 0}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:500;color:var(--bone)}
.side nav a:hover{background:rgba(204,208,207,.08)}
.side nav a.on{background:var(--bone);color:var(--ink);font-weight:700}
.side nav a .n{margin-left:auto;background:var(--steel);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 7px}
.side nav a.on .n{background:var(--navy)}
.side nav a .ag{margin-left:auto;font:700 9px var(--mono);letter-spacing:.08em;background:var(--mist);color:var(--ink);border-radius:4px;padding:1px 5px}
.side .me{margin-top:auto;border-top:1px solid var(--slate);padding:14px 8px 0;display:flex;gap:10px;align-items:center;font-size:13px}
.main{min-width:0;display:flex;flex-direction:column}
.tbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 36px}
.tbar .crumb{flex:1;font-size:14px;color:var(--steel)} .tbar .crumb b{color:var(--ink);font-weight:600}
.body{padding:28px 36px 56px;display:flex;flex-direction:column;gap:22px}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap} .ph h1{font-size:38px} .ph .grow p{margin-top:6px;color:var(--steel);font-size:15px}
.banner{border-radius:var(--r4);background:linear-gradient(120deg,var(--ink) 0%,var(--navy) 45%,var(--slate) 100%);color:#fff;padding:26px 30px;display:flex;align-items:center;gap:24px;position:relative;overflow:hidden}
.banner:after{content:"";position:absolute;right:-80px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,rgba(155,168,171,.25),transparent)}
.banner h2{font-size:30px;color:#fff} .banner p{color:var(--bone);margin-top:6px}
.stat{border-radius:var(--r3);padding:18px 20px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:#fff}
.stat .eyebrow{color:inherit;opacity:.8} .stat b{font-size:36px;font-weight:800;letter-spacing:-.04em;line-height:1.1} .stat small{font-size:12.5px;opacity:.8}
.stat.s1{background:var(--navy);color:#fff;border-color:var(--navy)} .stat.s2{background:var(--bone);border-color:var(--bone)} .stat.s3{background:#e2e6e5;border-color:#e2e6e5}
.stat.hl{border:2px solid var(--gold)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px} .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px} .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.split.r{grid-template-columns:minmax(0,1fr) 340px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.sec-h h3{font-size:17px;letter-spacing:-.02em}
.li{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid #edf0ef} .li:last-child{border-bottom:0}
.note-ai{border:1px solid var(--ai-ln);background:var(--ai-bg);border-radius:var(--r2);padding:12px 14px;font-size:13px;color:#24346e}
.warn{border:1px solid var(--wait-ln);background:var(--wait-bg);border-radius:var(--r2);padding:10px 12px;font-size:13px;color:var(--wait);display:flex;gap:8px;align-items:flex-start}
.okbox{border:1px solid var(--ok-ln);background:var(--ok-bg);border-radius:var(--r2);padding:10px 12px;font-size:13px;color:var(--ok);display:flex;gap:8px;align-items:flex-start}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-radius:4px;padding:0 5px;background:#fff}

/* responsive (container queries on the frame) */
@container f (max-width:1100px){.app{grid-template-columns:220px 1fr}.g4{grid-template-columns:repeat(2,1fr)}.split,.split.r{grid-template-columns:1fr}}
@container f (max-width:760px){
  .wrap{padding-inline:16px}.app{grid-template-columns:1fr}.side{display:none}.tbar{padding:0 16px}.body{padding:20px 16px 40px}
  .g2,.g3,.g4{grid-template-columns:1fr}.ph h1{font-size:30px}.banner{flex-direction:column;align-items:flex-start;padding:22px}
  .hd nav,.hd .search,.hd .hide-m{display:none}.ticket dl{grid-template-columns:1fr}.bar{grid-template-columns:90px 1fr 34px}
  .mnav{display:flex!important}
}
.mnav{display:none;position:sticky;bottom:0;background:var(--navy);color:var(--bone);justify-content:space-around;padding:8px 4px;font-size:11px}
.mnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;border-radius:8px} .mnav a.on{background:var(--bone);color:var(--ink)}

/* ================= screens ================= */
.art.hov{transition:transform .5s} a:hover .art.hov{transform:scale(1.03)}
.lvl{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.06em;border-radius:4px;padding:2px 6px;white-space:nowrap;border:1px solid var(--line2);color:var(--steel);background:#fff}
.lvl.lv2{background:var(--wait-bg);color:var(--wait);border-color:var(--wait-ln)}

.ladder-dk .ladder i{background:rgba(155,168,171,.25)} .ladder-dk .ladder i.on{background:var(--bone)} .ladder-dk .ladder i.on.top{background:linear-gradient(90deg,#e9c46a,var(--bone))} .ladder-dk .ladder-l{color:var(--mist)}

/* hero */
.hero{background:radial-gradient(1200px 500px at 85% 0%,rgba(74,92,106,.55),transparent 60%),linear-gradient(180deg,var(--ink),var(--navy));color:#e1e6e9;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(155,168,171,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(155,168,171,.06) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;padding-top:64px;padding-bottom:40px;align-items:center}
.hero-h{font-size:68px!important;color:#fff;letter-spacing:-.045em!important}
.hero-h em{color:var(--mist)!important;font-weight:300!important}
.hero-p{font-size:17px;color:var(--bone);max-width:560px;line-height:1.6}
.hero-ask{display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);border-radius:999px;padding:8px 8px 8px 16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);font-size:14px;max-width:620px}
.hero-ask .grow{color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hchip{border:1px solid rgba(155,168,171,.35);border-radius:99px;padding:3px 10px;color:var(--bone)}
.hero-r{position:relative;min-height:470px}
.hstack{position:relative;height:100%;min-height:470px}
.hcard{position:absolute;background:#fff;color:var(--ink);border-radius:var(--r3);box-shadow:var(--sh2);overflow:hidden}
.hcard.h1{left:8%;top:0;width:270px}
.hcard.h1 .art{aspect-ratio:4/5;border-radius:0}
.hc-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.hc-b .small{display:block;color:var(--steel)}
.hcard.h2{right:0;top:60px;width:230px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-left:4px solid var(--ok);transform:rotate(2deg)}
.hcard.h3{right:6%;bottom:6px;width:280px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;transform:rotate(-1.5deg)}
.hero-strip{position:relative;display:flex;flex-wrap:wrap;gap:12px 40px;align-items:center;padding-top:22px;padding-bottom:30px;border-top:1px solid rgba(155,168,171,.18);color:var(--mist);font-size:14px}
.hero-strip b{color:#fff;font-size:20px;letter-spacing:-.03em;margin-right:4px}
.blk{padding-top:72px;padding-bottom:16px}
.sec-t{display:flex;flex-direction:column;gap:10px;margin-bottom:28px} .sec-t h2{font-size:40px}
.pil{background:#fff;border:1px solid var(--line);border-radius:var(--r4);padding:28px;display:flex;flex-direction:column;gap:14px;min-height:280px}
.pil h3{font-size:24px} .pil p{color:var(--steel)} .pil-n{font-family:var(--mono);font-size:12px;color:var(--mist)}
.pil.dk{background:var(--navy);border-color:var(--navy);color:#e1e6e9} .pil.dk h3{color:#fff} .pil.dk p{color:var(--bone)}
.pil .chain,.pil .tags,.pil .mini-ticket{margin-top:auto}
.mini-ticket{background:linear-gradient(135deg,var(--ink),var(--slate));color:#fff;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;font-size:13px;position:relative}
.mini-ticket span{color:var(--mist)}
.flowband{background:var(--ink);color:#e1e6e9;padding:72px 0;margin-top:72px}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;counter-reset:f;position:relative}
.flow li{display:flex;flex-direction:column;gap:8px;padding:0 20px 0 0;position:relative}
.flow li:not(:last-child):after{content:"";position:absolute;top:24px;left:56px;right:8px;border-top:1px dashed rgba(155,168,171,.4)}
.fl-i{width:48px;height:48px;border-radius:14px;background:var(--navy);border:1px solid var(--slate);display:grid;place-items:center;color:var(--bone);margin-bottom:6px}
.flow b{color:#fff;font-size:18px} .flow p{font-size:13.5px;color:var(--mist)}
.ccg{display:grid;grid-template-columns:repeat(4,1fr);gap:18px} .ccg.k3{grid-template-columns:repeat(3,1fr)}
.cc{background:#fff;border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .25s,transform .25s}

.cc-m{position:relative} .cc-m .art{border-radius:0;aspect-ratio:16/11}
.cc-type{position:absolute;left:10px;top:10px;background:rgba(6,20,27,.78);color:#fff;font:600 11px var(--sans);padding:3px 9px;border-radius:99px;backdrop-filter:blur(4px)}
.cc-mou{position:absolute;right:10px;top:10px;background:linear-gradient(120deg,var(--ink),var(--slate));color:#e9c46a;font:700 10.5px var(--mono);padding:3px 8px;border-radius:5px}
.cc-b{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
.cc-n{display:block;font-size:15px;letter-spacing:-.01em} .cc-b .small.muted{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cc-sk{font-weight:600;font-size:13.5px;color:var(--slate)}
.cc-f{margin-top:auto;padding-top:10px;border-top:1px solid #edf0ef}
.cc .ring{width:46px;height:46px} .cc .ring span{width:36px;height:36px;font-size:13px}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-bottom:72px}
.cta-b{border-radius:var(--r4);padding:36px;background:linear-gradient(135deg,var(--navy),var(--slate));color:#e1e6e9;display:flex;flex-direction:column;gap:14px;align-items:flex-start;min-height:260px}

/* discover */
.disc-s{display:flex;align-items:center;gap:10px;height:50px;border-radius:999px;background:#fff;border:1px solid var(--line2);padding:0 8px 0 18px;color:var(--steel);flex:0 1 460px;min-width:0}
.disc{display:grid;grid-template-columns:240px 1fr;gap:28px;margin-top:20px;align-items:start}
.facets{background:#fff;border:1px solid var(--line);border-radius:var(--r3);padding:18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:12px}
.fac{display:flex;flex-direction:column;gap:2px} .fac>b{font-size:12px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--steel);font-weight:400;margin-bottom:4px}
.range{height:6px;border-radius:3px;background:var(--line);position:relative;margin:12px 0 6px} .range i{position:absolute;top:0;bottom:0;background:var(--navy);border-radius:3px}
.range i:before,.range i:after{content:"";position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--navy)} .range i:before{left:-8px} .range i:after{right:-8px}

/* profile */
.prof-ban{height:240px;overflow:hidden;position:relative;background:var(--navy)}
.prof-art .art{border-radius:0;aspect-ratio:auto;height:240px;width:100%;opacity:.9}
.prof-ban:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(6,20,27,.55))}
.prof{display:grid;grid-template-columns:330px 1fr;gap:32px;padding-bottom:64px}
.prof-id{margin-top:-90px;position:relative;z-index:2;padding:22px;display:flex;flex-direction:column;gap:16px;align-self:start;position:sticky;top:12px;box-shadow:var(--sh1)}
.prof-id .av.xl{margin-top:-70px}
.pstat{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r2)}
.pstat div{padding:10px;display:flex;flex-direction:column;align-items:center} .pstat div+div{border-left:1px solid var(--line)} .pstat b{font-size:18px} .pstat span{font-size:11.5px;color:var(--steel)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);padding-top:22px;font-weight:600;color:var(--steel);overflow-x:auto}
.tabs a{padding-bottom:12px;white-space:nowrap;cursor:pointer} .tabs a.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.lede{font-size:19px;line-height:1.55;color:var(--slate);max-width:760px;letter-spacing:-.01em}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #edf0ef;border-radius:var(--r2);background:var(--soft);flex-wrap:wrap}
.feat{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:auto auto;gap:14px}

.fw-b{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.hiw{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.hiw li{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--r2);background:var(--soft);border:1px solid #edf0ef;position:relative}
.hiw li span{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-bottom:6px}
.hiw li small{color:var(--steel);font-size:12px;line-height:1.4}
.sk{padding:10px 0;border-bottom:1px solid #edf0ef} .sk:last-child{border-bottom:0} .sk a{display:inline-flex;align-items:center;gap:4px;color:var(--navy);font-weight:600}
.rev{display:flex;gap:12px;margin-top:14px;padding:14px;border-radius:var(--r2);background:var(--soft)} .rev p{margin-top:6px;color:var(--slate)}

/* piece */
.piece{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:36px;align-items:start}
.player{position:relative;border-radius:var(--r3);overflow:hidden;background:var(--ink)}
.player .art{border-radius:0}
.pl-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(0deg,rgba(6,20,27,.85),transparent);color:#fff;font-size:11px;z-index:4}
.pl-bar b{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.3);position:relative} .pl-bar b i{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px}
.player .bigplay,.dv-p .bigplay{position:absolute;inset:0;margin:auto;width:60px;height:60px;border-radius:50%;background:rgba(238,240,239,.9);display:grid;place-items:center;z-index:3;color:var(--ink)}

.facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r3);background:#fff;overflow:hidden}
.facts.f4{grid-template-columns:repeat(4,1fr)}
.facts div{padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-right:1px solid #edf0ef;border-bottom:1px solid #edf0ef}
.facts span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)} .facts b{font-size:16px}
.made{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.made li{display:flex;gap:14px;padding-bottom:16px;position:relative}
.made li:not(:last-child):before{content:"";position:absolute;left:11px;top:24px;bottom:0;border-left:2px solid var(--line)}
.mk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);background:#fff;display:grid;place-items:center;flex-shrink:0}

.bvd>div+div{background:var(--ok-bg)}

/* briefs */
.bc{background:#fff;border:1px solid var(--line);border-radius:var(--r3);padding:18px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .25s}
.bc:hover{box-shadow:var(--sh1)}

  <label class="disc-s">${I('search')}<input id="dq" class="grow" placeholder="Search skills, tools, styles, names…" autocomplete="off"><span class="ai-mark">${I('spark','sm')}Ask AI</span></label></div>
 <div class="cats" id="dcats"></div>
 <div class="disc"><aside class="facets ${DS.open?'open':''}" id="dfac"></aside>
  <div class="stack g16"><button class="btn sec fbtn" data-ftog>${I('menu')}Filters</button><div id="dhead" class="stack g12"></div><div class="ccg k3" id="dres"></div></div></div>
</div>`);
S2.P2.init=()=>{
 const root=document.getElementById('dsc');if(!root)return;
 const draw=()=>{const [res,html]=dRes();root.querySelector('#dcats').innerHTML=dCats();root.querySelector('#dfac').innerHTML=dFacets();root.querySelector('#dfac').classList.toggle('open',DS.open);root.querySelector('#dhead').innerHTML=dHead(res);root.querySelector('#dres').innerHTML=html};
 const q=root.querySelector('#dq');q.value=DS.q;q.addEventListener('input',()=>{DS.q=q.value.trim();draw()});
 root.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.f){const s=DS.sel[t.dataset.f];t.checked?s.add(t.dataset.v):s.delete(t.dataset.v)}
  else if(t.hasAttribute('data-vonly'))DS.vOnly=t.checked;else if(t.hasAttribute('data-avail'))DS.avail=t.checked;else if(t.hasAttribute('data-sort'))DS.sort=t.value;else return;draw()});
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-cat'))DS.cat=DS.cat===b.dataset.cat?'':b.dataset.cat;
  else if(b.dataset.exp){DS.exp.has(b.dataset.exp)?DS.exp.delete(b.dataset.exp):DS.exp.add(b.dataset.exp)}
  else if(b.hasAttribute('data-maxp'))DS.maxP=+b.dataset.maxp;else if(b.hasAttribute('data-days'))DS.days=+b.dataset.days;
  else if(b.hasAttribute('data-ftog'))DS.open=!DS.open;
  else if(b.hasAttribute('data-more'))DS.more=!DS.more;
  else if(b.hasAttribute('data-clear')){DS.cat='';DS.q='';q.value='';Object.values(DS.sel).forEach(s=>s.clear());DS.vOnly=false;DS.maxP=0;DS.days=0;DS.avail=false}
  else if(b.dataset.rm){const k=b.dataset.rm;if(k==='cat')DS.cat='';else if(k==='vonly')DS.vOnly=false;else if(k==='maxp')DS.maxP=0;else if(k==='days')DS.days=0;else if(k==='avail')DS.avail=false;else if(k==='q'){DS.q='';q.value=''}else DS.sel[k].delete(b.dataset.v)}
  else return;draw()});
 draw();
};

pick.addEventListener('change',()=>{location.hash=pick.value});
const step=d=>{const i=ORDER2.indexOf(pick.value);location.hash=ORDER2[(i+d+ORDER2.length)%ORDER2.length]};
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
const stage=document.getElementById('stage'),vD=document.getElementById('vDesk'),vP=document.getElementById('vPhone');
const setView=p=>{stage.classList.toggle('phone',p);vD.setAttribute('aria-pressed',!p);vP.setAttribute('aria-pressed',p);try{localStorage.setItem('unio9-view',p?'phone':'desk')}catch(e){}};
vD.onclick=()=>setView(false);vP.onclick=()=>setView(true);
try{if(localStorage.getItem('unio9-view')==='phone')setView(true)}catch(e){}
frame.addEventListener('click',e=>{
 const tb=e.target.closest('[data-tab]');if(tb){const g=tb.closest('[data-tabs]');g.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===tb));g.querySelectorAll('[data-pane]').forEach(p=>p.hidden=p.dataset.pane!==tb.dataset.tab);return}
 const o=e.target.closest('[data-open]');if(o){const m=frame.querySelector('#'+o.dataset.open);if(m){m.hidden=false;m.scrollIntoView({behavior:'smooth',block:'start'})}return}
 if(e.target.closest('[data-close]')){const s=e.target.closest('.scrim');if(s)s.hidden=true}
 const t=e.target.closest('.seg span,.seg button,.tabs a');if(t&&!t.closest('a[href]')){[...t.parentElement.children].forEach(x=>x.classList.toggle('on',x===t))}
 const c=e.target.closest('.chipsel');if(c&&c.closest('.qa,.row')&&!c.querySelector('svg.i')){const q=c.closest('.qa');if(q)[...q.querySelectorAll('.chipsel')].forEach(x=>x.classList.toggle('on',x===c));else c.classList.toggle('on')}
 const r=e.target.closest('.role');if(r){r.parentElement.querySelectorAll('.role').forEach(x=>x.classList.toggle('on',x===r))}
});
show();

</script></body></html>
